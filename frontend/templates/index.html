{% extends "base.html" %}

{% block title %}首页 - 题库管理系统{% endblock %}

{% block content %}
<div class="hero">
    <h2>欢迎使用题库管理系统</h2>
    <p>一个功能完善的题目收集、管理和组卷系统</p>
</div>

<div class="features">
    <div class="feature-card">
        <div class="feature-icon">📤</div>
        <h3>智能导入</h3>
        <p>支持图片和PDF文件，使用OCR技术精准识别文本内容</p>
        <a href="/upload" class="btn btn-primary">开始导入</a>
    </div>

    <div class="feature-card">
        <div class="feature-icon">📝</div>
        <h3>题目管理</h3>
        <p>按知识点、题型分类管理题目，支持标签系统</p>
        <a href="/questions" class="btn btn-primary">管理题目</a>
    </div>

    <div class="feature-card">
        <div class="feature-icon">📋</div>
        <h3>智能组卷</h3>
        <p>按知识点或题型选题，支持A4/A3排版，导出Word文档</p>
        <a href="/exam" class="btn btn-primary">开始组卷</a>
    </div>
</div>

<div class="stats-section">
    <h3>系统统计</h3>
    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-value" id="questionCount">-</div>
            <div class="stat-label">题目总数</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="tagCount">-</div>
            <div class="stat-label">标签数量</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="examCount">-</div>
            <div class="stat-label">试卷数量</div>
        </div>
    </div>
</div>

<script>
// 加载统计数据
async function loadStats() {
    try {
        const [questions, tags, papers] = await Promise.all([
            fetch('/api/questions').then(r => r.json()),
            fetch('/api/tags').then(r => r.json()),
            fetch('/api/exam/papers').then(r => r.json())
        ]);

        document.getElementById('questionCount').textContent = questions.questions?.length || 0;
        document.getElementById('tagCount').textContent = tags.tags?.length || 0;
        document.getElementById('examCount').textContent = papers.papers?.length || 0;
    } catch (error) {
        console.error('加载统计数据失败:', error);
    }
}

loadStats();
</script>
{% endblock %}
